name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Syntax check
        run: npm run check

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('frontend/manifest.webmanifest', 'utf8'))"

  version-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: タグの重複チェック
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::タグ ${TAG} は既に存在します。main へマージすると deploy.yml の tag ジョブが失敗します。package.json の version を上げてから（npm run version:patch 等）マージしてください。"
            exit 1
          fi
          echo "タグ ${TAG} は未使用です。"

  # ワークフローの式テンプレート長（21,000バイト）超過を検出する。
  # 超過するとワークフローファイル自体が無効になり、issue_comment等のトリガーが
  # 一切発火しなくなるため、developへ入る前に落とす（issue-deck#901・本リポジトリ#74）。
  workflow-expression-length-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Workflow expression length check
        run: node scripts/check-workflow-expression-length.mjs

  # checkoutしないジョブでghを使いながらリポジトリ指定が無いステップを検出する
  # （issue-deck#929・本リポジトリ#74）。
  workflow-gh-repo-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Workflow gh repository check
        run: scripts/check-workflow-gh-repo.sh

  notify:
    needs: [lint, version-check, workflow-expression-length-check, workflow-gh-repo-check]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          lint="${{ needs.lint.result }}"
          version_check="${{ needs.version-check.result }}"
          expr_len="${{ needs.workflow-expression-length-check.result }}"
          gh_repo="${{ needs.workflow-gh-repo-check.result }}"
          if [ "$lint" = "success" ] && [ "$expr_len" = "success" ] && [ "$gh_repo" = "success" ] && [ "$version_check" != "failure" ]; then
            result=success
          elif [ "$lint" = "cancelled" ] || [ "$version_check" = "cancelled" ] || [ "$expr_len" = "cancelled" ] || [ "$gh_repo" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = "success" ]; then
            echo "jobs=lint, version-check, workflow-expression-length-check, workflow-gh-repo-check" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=lint: $lint, version-check: $version_check, workflow-expression-length-check: $expr_len, workflow-gh-repo-check: $gh_repo" >> "$GITHUB_OUTPUT"
          fi
          # develop push: failure only. main PR: success, failure, and cancelled.
          if [ "$result" = "failure" ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load secrets from 1Password
        if: steps.status.outputs.should_notify == 'true'
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: .github/ci.env.tpl

      - name: Signaly に通知
        if: steps.status.outputs.should_notify == 'true'
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: 買い物リスト
          NOTIFY_KIND: CI
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
          NOTIFY_JOB: ${{ steps.status.outputs.jobs }}
        run: bash .github/scripts/signaly-notify.sh
