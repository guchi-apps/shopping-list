name: Claude Issue Dispatch

# Issueへの@claudeコメントを起点にした無人実行の、本リポジトリ側のトリガー定義。
#
# ジョブ本体は持たず、issue-deckの再利用可能ワークフローを参照する
# (guchi-apps/issue-deck#934・#945、本リポジトリ#81)。従来はワークフローをコピーして
# 持っていたが、issue-deck側の改善を手でバックポートし続ける運用が対象リポジトリの
# 増加に耐えないため、本体をissue-deckへ集約する方式へ移行した。
#
# 本リポジトリ固有の差異はwith:で吸収する。
#   runtime-setup: minimal   DBなし・依存パッケージはplaywrightのみ
#   node-version:  20.19     ci.ymlと揃える(guchi-apps/issue-deck#956)
#   post-implement-script    撮影は自前バックエンドの起動が必要なため独自スクリプト
#                            (guchi-apps/issue-deck#952、本リポジトリ#79)
#   prompts-ref              プロンプトはissue-deck側のものを使う。指定しないと本リポジトリの
#                            .github/prompts/が読まれ、存在しないため落ちる
#                            (guchi-apps/issue-deck#960)。uses:と同じタグを指定すること
#
# 参照はタグ固定にする。@developを参照するとissue-deck側の不具合が即座に波及するため。
# issue-deck自身だけがローカルパス参照で常に最新を使い、カナリアとして先に問題を検知する。
#
# プレビュー系の2ジョブは、呼び出すdeploy-preview.ymlの中身がアプリ固有(Fly.io設定)の
# ため、共通化せずここに残している。
on:
  issues:
    types: [unlabeled]
  issue_comment:
    types: [created]
  # 計画/実装フォールバック検証ステップ専用の自己リトライ起動経路(issue-deck #497)。
  # 人間が直接手動実行することも許容する(GitHub側がworkflow_dispatchの実行自体に
  # write権限を要求するため、実行者チェックの信頼レベルは他のトリガー経路と同等)。
  workflow_dispatch:
    inputs:
      issue_number:
        description: "対象issue番号"
        required: true
        type: string
      retry_attempt:
        description: "これまでの自動リトライ回数(0始まり。指定した回数の次の試行として実行する)"
        required: false
        type: string
        default: "0"

jobs:
  dispatch:
    uses: guchi-apps/issue-deck/.github/workflows/reusable-issue-dispatch.yml@workflows/v25
    with:
      runtime-setup: minimal
      package-manager: npm
      node-version: "20.19"
      post-implement-script: scripts/ci-post-implement.sh
      # 上の uses: と同じタグを指定する。片方だけ上げると新しいワークフローで
      # 古いプロンプトが使われる。
      prompts-ref: workflows/v25
    secrets: inherit
    # 呼ばれる側の権限はcallerの付与範囲を超えられない。
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write


  # 23.preview-requiredが付いているIssueで実装(implement/additional)が完了した場合、
  # deploy-preview.ymlを呼び出し、実装ブランチ(issue-<番号>)を実際にFly.io Machines上へ
  # デプロイする(#54)。developではなく実装ブランチそのものをデプロイ対象にするのは、develop向け
  # PRのレビュー中に実際の変更内容を画面で確認できるようにするため。
  #
  # mode判定にはtriageジョブの出力(待機前の判定)ではなくdispatchジョブのoutputs.final_mode
  # (「triageの判定結果を引き継ぐ」ステップの陳腐化チェック後の値)を使う。concurrencyの順番待ちの
  # 間にIssueがクローズされる・00.check-userが付与される等でdispatch側がmode=skipへ倒した場合に、
  # 実装が行われていないのにデプロイだけ走ってしまうのを防ぐため。
  #
  # 独自の`if:`条件を指定しているが、always()/failure()/cancelled()を使っていないため、
  # GitHub Actionsの仕様によりsuccess()が暗黙にANDされる。そのためdispatchジョブが失敗した
  # 場合はこのジョブも実行されない。
  deploy-preview:
    needs: [dispatch]
    if: needs.dispatch.outputs.preview_required == 'true' && (needs.dispatch.outputs.final_mode == 'implement' || needs.dispatch.outputs.final_mode == 'additional')
    uses: ./.github/workflows/deploy-preview.yml
    with:
      ref: ${{ needs.dispatch.outputs.branch }}
    secrets: inherit


  # deploy-previewジョブの結果をIssueへ別コメントとして通知する。実装完了報告コメント
  # (dispatchジョブ内のClaude Codeステップが投稿するもの)は、deploy-previewジョブの完了を
  # 待たずに投稿される(fly deploy等を含み数分かかるため、実装ステップの中で同期的に待つことが
  # できない)。実際に開けるプレビューURLは、本ジョブが後から別コメントとして追記する。
  #
  # `always()`で起動しつつ、deploy-previewがskipされた場合(preview_required=falseや
  # mode不一致)は通知しない。deploy-previewが失敗した場合は成功時と同じジョブから失敗を報告する
  # (notify-failureジョブと役割が重ならないよう、プレビューデプロイ固有の失敗はこちらで扱う)。
  notify-preview-url:
    needs: [dispatch, deploy-preview]
    if: always() && needs.deploy-preview.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: プレビューURLをIssueに通知する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.dispatch.outputs.issue_number }}
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          DEPLOY_RESULT: ${{ needs.deploy-preview.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          if [ "$DEPLOY_RESULT" = "success" ] && [ -n "$PREVIEW_URL" ]; then
            BODY="🚀 プレビュー環境へのデプロイが完了しました。実際に開けるプレビューURLはこちらです: $PREVIEW_URL"
          else
            BODY="⚠️ プレビュー環境へのデプロイに失敗しました（結果: $DEPLOY_RESULT）。実行ログをご確認ください: $RUN_URL"
          fi
          BODY="$BODY"$'\n\n<!-- issue-deck-source:claude-issue-dispatch -->'$'\n\n<!-- issue-deck-agent:implementer -->'
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"