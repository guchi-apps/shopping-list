name: Issue Labels

# m-guchi/issue-deck の .github/workflows/issue-labels.yml を移植したもの。
# 移植元コミット: 29958837e7569c852740742dfd30daa2c03e89fc
# 導入手順は issue-deck の docs/cross-repo-setup-guide.md を参照。
# 以下のコメント中の #番号 は issue-deck 側のIssue番号を指す。
#
# 移植時の改変: スクリーンショット撮影（24.screenshot-required）を導入していないため、
# cleanup-on-closeジョブから screenshots ブランチの掃除ステップを削除した。
#
# Issueラベル(01.planning -> 02.wip -> 03.d:marge -> 05.develop -> 07.m:marge -> 09.main。
# 01.planningは21.plan-required選択時のみ経由する)の状態遷移をイベント駆動で保証する。
# 実装エージェント・レビュー統合エージェントによる手動のラベル付け替えを置き換えるもの
# ではなく、付け忘れがあっても後から是正されるようにするための安全網、および
# develop->mainの遷移(07/09)をカバーするためのもの。
#
# develop-pr-opened(03.d:marge)・develop-pr-merged(05.develop)の2ジョブは、
# ラベル遷移と同時にIssueへ完了報告のコメントも投稿する。ラベルより気付きやすい
# 通知手段として、実装エージェント経由・人間の手動PRのどちらでも同じ場所
# (PRオープン・マージイベント)で確実に発火する。
#
# 対象issueの番号は、本リポジトリの命名規約であるブランチ名 issue-<番号> から特定する。
# head_ref等の値はscript injectionを避けるため env 経由でのみ参照し、run: 本文に
# 直接展開しない。
#
# gh issue edit の --add-label/--remove-label は、既に付与済み/未付与のラベルに
# 対して呼んでも無害(冪等)なため、状態を事前チェックせず毎回呼び出してよい。
#
# develop-pr-mergedジョブは、claude-review-develop.ymlのauto-mergeジョブが有効化する
# GitHub Auto-merge機能による実際のマージ(必須ステータスチェック通過後にGitHub側が
# 非同期に実行)では発火しないことがある(issue-deck #112。GITHUB_TOKEN起点のイベントは
# 他のワークフローを起動しないというGitHub仕様の影響を受けるため)。
# develop-merge-sweepジョブはこれを取りこぼした03.d:margeをscheduleで定期的に拾い直す。
#
# cleanup-on-closeジョブは、上記の状態遷移(main-pr-mergedによる09.main遷移)を経由しない
# Issueクローズ(例: 21.plan-requiredの計画をユーザーが承認・練り直しのいずれもせず、
# `not planned`等の理由でIssueを直接クローズして実装自体を取りやめた場合)で、
# `00.check-user`ラベルが「要確認」のまま残り続けるのを防ぐための安全網(issue-deck #172)。
# クローズ済みのIssueはclaude-issue-dispatch.ymlの全モードで再始動しないため
# (`issue_closed`ガード)、`00.check-user`を除去してもワークフローが誤って再始動することはない。
#
# `00.check-user`はclaude-review-develop.ymlの自動マージ不可判定でも「マージ保留」
# シグナルとして使われ、付与時は人間がPRリンクから手動マージする運用になっている。
# その手動マージ自体が確認完了を意味するため、develop-pr-merged・develop-merge-sweep・
# main-pr-mergedの各ジョブでは状態遷移とあわせて`00.check-user`も除去する(issue-deck #266)。

on:
  push:
    branches:
      - "issue-*"
  pull_request:
    types: [opened, synchronize, closed]
    branches:
      - develop
      - main
  issues:
    types: [closed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

jobs:
  wip-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 02.wip を付与する
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^issue-([0-9]+)$ ]]; then
            gh issue edit "${BASH_REMATCH[1]}" --add-label "02.wip"
          fi

  develop-pr-opened:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 03.d:marge へ遷移する
        run: |
          if [[ "$HEAD_REF" =~ ^issue-([0-9]+)$ ]]; then
            gh issue edit "${BASH_REMATCH[1]}" --add-label "03.d:marge" --remove-label "02.wip"
            gh issue comment "${BASH_REMATCH[1]}" --body "🔧 実装が完了し、developへのPRを作成しました: $PR_URL"$'\n\n'"実行ログ: $RUN_URL"$'\n\n<!-- issue-deck-source:issue-labels -->'
          fi

  develop-pr-merged:
    # 00.check-userが付いたPRは自動マージがスキップされ、人間がPRリンクから手動マージする
    # 運用になっている(claude-review-develop.ymlのauto-mergeジョブ参照)。このマージ操作自体が
    # 「確認済み」を意味するため、05.develop遷移とあわせて00.check-userもここで除去する。
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 05.develop へ遷移する
        run: |
          if [[ "$HEAD_REF" =~ ^issue-([0-9]+)$ ]]; then
            gh issue edit "${BASH_REMATCH[1]}" --add-label "05.develop" --remove-label "03.d:marge" --remove-label "02.wip" --remove-label "00.check-user"
            gh issue comment "${BASH_REMATCH[1]}" --body "✅ developへのマージが完了しました: $PR_URL"$'\n\n'"実行ログ: $RUN_URL"$'\n\n<!-- issue-deck-source:issue-labels -->'
          fi

  develop-merge-sweep:
    # GitHub Auto-merge機能によるマージがdevelop-pr-mergedジョブを起動しなかった
    # ケースの安全網。03.d:margeが付いた全issueについて、対応ブランチ(issue-<番号>)
    # からdevelopへのPRが既にマージ済みかを確認し、マージ済みなら05.developへ遷移する。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: マージ済みのdevelop向けPRを持つissueを05.developへ遷移する
        run: |
          for n in $(gh issue list --label "03.d:marge" --state open --json number --jq '.[].number'); do
            pr_url="$(gh pr list --state merged --base develop --head "issue-$n" --json url --jq '.[0].url // empty')"
            if [ -n "$pr_url" ]; then
              gh issue edit "$n" --add-label "05.develop" --remove-label "03.d:marge" --remove-label "02.wip" --remove-label "00.check-user"
              gh issue comment "$n" --body "✅ developへのマージが完了しました: $pr_url"$'\n\n'"実行ログ: $RUN_URL"$'\n\n<!-- issue-deck-source:issue-labels -->'
            fi
          done

  main-pr-in-progress:
    # develop -> main のPRが開いている間、その時点で05.developが付いている
    # 全issueを07.m:margeへ一括遷移する。synchronizeも対象にすることで、
    # PRオープン後にdevelopへ追加マージされたissueも随時反映する。
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize') &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 05.develop の issue を 07.m:marge へ一括遷移する
        run: |
          for n in $(gh issue list --label "05.develop" --state open --json number --jq '.[].number'); do
            gh issue edit "$n" --add-label "07.m:marge" --remove-label "05.develop" --remove-label "03.d:marge" --remove-label "02.wip"
          done

  main-pr-merged:
    # develop -> main のPRがマージされた時点で、05.develop/07.m:margeの
    # どちらが付いているissueも09.mainへ一括遷移してcloseする。両方のラベルを
    # 対象にするのは、main-pr-in-progressのsynchronizeが拾いきれていない
    # 可能性のあるissue(マージ直前にdevelopへ入ったもの)を取りこぼさないため。
    #
    # ここでの`gh issue close`はGITHUB_TOKEN起点のため、cleanup-on-closeジョブの
    # `issues: closed`トリガーは発火しない(他ジョブと同様のGitHub仕様)。
    # そのため00.check-userが残っていた場合の除去をこのジョブ自身でも行っておく。
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 09.main へ一括遷移し issue を close する
        run: |
          issues="$(
            { gh issue list --label "05.develop" --state open --json number --jq '.[].number'
              gh issue list --label "07.m:marge" --state open --json number --jq '.[].number'
            } | sort -un
          )"
          for n in $issues; do
            gh issue edit "$n" --add-label "09.main" --remove-label "05.develop" --remove-label "07.m:marge" --remove-label "03.d:marge" --remove-label "02.wip" --remove-label "00.check-user"
            gh issue close "$n"
          done

  cleanup-on-close:
    # main-pr-mergedの09.main遷移以外の経路でIssueがクローズされた場合(21.plan-requiredの
    # 計画を拒否してIssueを直接クローズした場合など)、`00.check-user`および進捗ラベル
    # (01.planning/02.wip/03.d:marge/05.develop/07.m:marge)が残り続けないよう、クローズを
    # トリガーに除去する。`09.main`は「本番反映済み」を示す恒久的な状態としてissue-deckの
    # ダッシュボード側(直近リリース分のクラスタリング・完了バッジ表示)が参照しているため、
    # 他の進捗ラベルと異なり除去対象から明示的に除外する。
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: 00.check-user と進捗ラベル(09.mainを除く)を除去する
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "00.check-user" \
            --remove-label "01.planning" \
            --remove-label "02.wip" \
            --remove-label "03.d:marge" \
            --remove-label "05.develop" \
            --remove-label "07.m:marge"
