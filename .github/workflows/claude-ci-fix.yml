name: Claude CI Fix

# develop向けPR(issue-<番号>ブランチ)のCI(.github/workflows/ci.yml)が失敗した際、
# Claude Codeが原因を修正してpushするワークフローの、本リポジトリ側のトリガー定義。
#
# ジョブ本体は持たず、issue-deckの再利用可能ワークフローを参照する
# (guchi-apps/issue-deck#1066・#1090)。従来はワークフローをコピーして持っていたが、
# issue-deck側の改善を手でバックポートし続ける運用が対象リポジトリの増加に耐えないため、
# 本体をissue-deckへ集約する方式へ移行した。
#
# 本リポジトリ固有の差異はwith:で吸収する。
#   runtime-setup: node        Nodeのセットアップは要る(下記node-version参照)
#   package-manager: npm
#   node-version: "20.19"      ci.ymlと揃える。検証がnode --checkのため、Nodeのバージョン差で
#                              構文チェックの結果が変わりうる
#   install-dependencies: false 依存はdevDependenciesのplaywright 1つだけで、検証
#                              (npm run check)はnode_modulesを要さない。毎回のnpm ciは無駄
#                              (guchi-apps/issue-deck#1090)
#   verify-commands            ci.ymlのlintジョブと同じ検証内容を指示する
#   prompts-ref                プロンプトはissue-deck側のものを使う。指定しないと本リポジトリの
#                              .github/prompts/が読まれ、存在しないため落ちる。uses:と同じタグにすること
#
# 参照はタグ固定にする。@developを参照するとissue-deck側の不具合が即座に波及するため。
# issue-deck自身だけがローカルパス参照で常に最新を使い、カナリアとして先に問題を検知する。

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      issue_number:
        description: "対象のIssue番号（develop向けPRのissue-<番号>ブランチのIssue番号）"
        required: true
        type: number

jobs:
  ci-fix:
    uses: guchi-apps/issue-deck/.github/workflows/reusable-claude-ci-fix.yml@workflows/v13
    with:
      runtime-setup: node
      package-manager: npm
      node-version: "20.19"
      install-dependencies: false
      # 再利用ワークフロー内のinputsコンテキストはworkflow_callのinputsを指すため、
      # 本ワークフローのworkflow_dispatch入力はここで明示的に渡す。
      issue-number: ${{ inputs.issue_number }}
      # プロンプトの「- 修正後、」に続けてそのまま埋め込まれるため、文末まで含めて1行で書く。
      verify-commands: "`npm run check` と `node -e \"JSON.parse(require('fs').readFileSync('frontend/manifest.webmanifest', 'utf8'))\"` を実行し、いずれも問題がないことを確認する（`.github/workflows/ci.yml`の`lint`ジョブと同じ内容）"
      # 上の uses: と同じタグを指定する。片方だけ上げると新しいワークフローで
      # 古いプロンプトが使われる。
      prompts-ref: workflows/v13
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
