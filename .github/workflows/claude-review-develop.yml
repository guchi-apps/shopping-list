name: Claude Code Review (develop向けPR)

# develop向けPRの作成・更新時に、機械的リスク判定・Claude Codeによる自動レビュー・
# 低リスクPRの自動マージを行うワークフローの、本リポジトリ側のトリガー定義。
#
# ジョブ本体は持たず、issue-deckの再利用可能ワークフローを参照する
# (guchi-apps/issue-deck#1078・#1090)。
#
# 本リポジトリ固有の差異はwith:で吸収する。
#   dependency-check: any  npm依存パッケージゼロを方針としているため、メジャー更新だけでなく
#                          依存の新規追加自体が方針の変更にあたる
#   lock-files             本リポジトリはnpm(package-lock.json)
#   risk-paths             本リポジトリ固有のリスクパス。.github/workflows/** ・.env* ・
#                          **/auth/** ・.shared-context/** ・prisma/migrations/** は
#                          再利用ワークフロー側に内蔵されているため書かない
#                          (入力はリスクを追加できるが削減はできない)
#   prompts-ref            uses:と同じタグを指定すること
#
# concurrency: 新しいpushが来たら古い実行を丸ごとキャンセルする。呼び出し元の
# ワークフローレベルに置くことで、呼び出し先のジョブも一緒にキャンセルされる。
concurrency:
  group: claude-review-develop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop

jobs:
  review:
    uses: guchi-apps/issue-deck/.github/workflows/reusable-claude-review-develop.yml@workflows/v12
    with:
      dependency-check: any
      lock-files: "package-lock.json"
      risk-paths: |
        \.env\.tpl$ :: 環境変数テンプレートの変更 (**/*.env.tpl)
        ^deploy/|^scripts/update-env-file\.sh$ :: 本番環境の設定・シークレット注入スクリプトの変更 (deploy/**・scripts/update-env-file.sh)
      prompts-ref: workflows/v12
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
