name: Claude Conflict Resolve

# develop向けPRがdevelopとの間でコンフリクトした際、Claude Codeが解消を試みる
# ワークフローの、本リポジトリ側のトリガー定義。
#
# ジョブ本体は持たず、issue-deckの再利用可能ワークフローを参照する
# (guchi-apps/issue-deck#1066・#1090)。入力の意味はclaude-ci-fix.ymlのコメントを参照
# (同じ設計・同じ値)。
#
# 参照はタグ固定にする。@developを参照するとissue-deck側の不具合が即座に波及するため。

on:
  push:
    branches:
      - develop
  pull_request:
    types:
      - opened
      - reopened
    branches:
      - develop
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  conflict-resolve:
    uses: guchi-apps/issue-deck/.github/workflows/reusable-claude-conflict-resolve.yml@workflows/v8
    with:
      runtime-setup: node
      package-manager: npm
      node-version: "20.19"
      install-dependencies: false
      # プロンプトの「- 解消後、」に続けてそのまま埋め込まれるため、文末まで含めて1行で書く。
      verify-commands: "`npm run check`（`node --check`による構文チェック）を実行し、問題がないことを確認する（このリポジトリにはテスト・ビルド・型チェックは存在しない）"
      # 上の uses: と同じタグを指定する。
      prompts-ref: workflows/v8
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
