name: Release develop to main

# m-guchi/issue-deck の .github/workflows/release-develop-to-main.yml を移植したもの。
# 移植元コミット: 29958837e7569c852740742dfd30daa2c03e89fc
# 導入手順は issue-deck の docs/cross-repo-setup-guide.md を参照。
# 以下のコメント中の #番号 は issue-deck 側のIssue番号を指す。
#
# 移植時の改変（本リポジトリのバージョン運用に合わせるため）:
# - バージョンbumpを`npm pkg set version`から`npm version <新バージョン> --no-git-tag-version`へ
#   変更した。本リポジトリはnpmのversion lifecycleフック（package.jsonの`version`スクリプト →
#   scripts/version-changelog.mjs）で`frontend/changelog.js`のAPP_VERSION更新とスタブエントリ挿入を
#   行うため、フックが走らない`npm pkg set version`では更新履歴が欠落する。
#   `--no-git-tag-version`はコミット・タグ作成を抑止する（タグはmainへのデプロイ時に
#   deploy.ymlが作成するため、ここでは作らない）。
# - 上記スタブの`changes`をコード差分から自動生成するため、バージョン判定のClaude Codeステップの
#   構造化出力に`changelog`（ユーザーが画面で体感できる変更の一覧）を追加した。
# - バンプPRの自動マージ（`gh pr merge --auto`）は行わない。自動生成した更新履歴の文面は
#   ユーザー向けに公開されるため、人間のレビューを必ず挟む。
# - develop→mainのPR作成も、バンプPRのdevelopマージをトリガーに無人で自動作成される
#   仕様（移植元issue-deckの元の挙動）を廃止し、バンプPR作成と同様に
#   workflow_dispatch（人間による手動起動）でのみ作成するよう変更した（#55）。
#
# release-to-mainスキルが定める手順のうち、「1. バージョンを上げる」
# 「2. developへの反映（フィーチャーブランチ+PR）」「3. develop→mainのPRを作成する」までを
# 自動化する。ただしいずれの手順も、人間がworkflow_dispatchで明示的に起動した場合にのみ
# 実行される（後述のとおりpushトリガーは持たない）。
#
# バンプPRがdevelopへマージされてpackage.jsonのversionが変わっても、本ワークフローは
# 自動では再起動しない。develop→mainのPRを作成するには、バンプPRのマージ後に人間が
# 改めてworkflow_dispatchで本ワークフローを起動する必要がある。develop→mainの実際の
# マージ（マージコミット必須）はCLAUDE.mdの自動マージ不可カテゴリに該当するため、
# これまでどおり人間が手動で行う。
#
# 状態はdevelop/mainのpackage.jsonのversionフィールドだけから判定する（他に状態を
# 保持しない）。
# - main版 == develop版: まだ何もバンプしていない。develop向けのバンプPRが無ければ
#   新規に作成する（既にバンプPRがオープン中なら二重作成を避けるため何もしない）。
# - main版 != develop版: バンプPRが既にdevelopへマージ済み。develop→mainのPRが
#   無ければ新規に作成する。
#
# バージョンの上げ幅（major/minor/patch）は、issueのラベルではなくmain/develop間の実際の
# コード差分の内容からClaude Code（claude-code-action、--json-schemaによる構造化出力）が
# semverに基づき判定する。判定に失敗した場合はpatchにフォールバックする。
#
# バンプPR・develop→mainのPRのいずれも人間の確認なしに作成されることを避けるため、
# scheduleやpushでの自動起動は行わず、利用者のworkflow_dispatch（手動）でのみ起動する。

on:
  workflow_dispatch: {}

concurrency:
  # 同時に複数実行してバンプPRやdevelop→mainのPRを二重作成しないよう直列化する。
  group: release-develop-to-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          # フィーチャーブランチのpush・PR作成を後続のCI/レビューworkflow
          # (ci.yml, claude-review-develop.yml)が確実に検知できるよう、
          # GITHUB_TOKEN起点のイベントは他のworkflowを起動しないというGitHub仕様を
          # 避けるためWORKFLOW_PATを使う（claude-issue-dispatch.ymlと同じ方針）。
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Setup Node.js
        # npm version（lifecycleフック経由でscripts/version-changelog.mjsを実行）に使う。
        # バージョンはci.ymlと揃える。
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: develop/mainの最新を取得する
        # actions/checkoutが作成するリモート追跡ブランチの範囲に依存せず、
        # origin/develop・origin/mainを確実に参照できるよう明示的なrefspecで取得する。
        run: |
          git fetch origin develop:refs/remotes/origin/develop --quiet --force
          git fetch origin main:refs/remotes/origin/main --quiet --force

      - name: リリース状態を判定する
        id: state
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e

          MAIN_VERSION="$(git show origin/main:package.json | jq -r .version)"
          DEV_VERSION="$(jq -r .version package.json)"
          echo "main_version=$MAIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "dev_version=$DEV_VERSION" >> "$GITHUB_OUTPUT"

          NEED_BUMP=false
          NEED_MAIN_PR=false

          if [ "$MAIN_VERSION" = "$DEV_VERSION" ]; then
            if git diff --quiet origin/main origin/develop; then
              echo "developとmainに差分が無いため、リリースするものがありません"
            else
              EXISTING_BUMP_PR="$(gh pr list --base develop --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("release/v"))] | .[0].headRefName // empty')"
              if [ -n "$EXISTING_BUMP_PR" ]; then
                echo "バージョンbump用のPR（$EXISTING_BUMP_PR）が既にオープン中のため、新規作成をスキップします"
              else
                NEED_BUMP=true
              fi
            fi
          else
            echo "developのバージョン($DEV_VERSION)がmain($MAIN_VERSION)と異なるため、バンプ済みとみなします"
            EXISTING_MAIN_PR="$(gh pr list --base main --head develop --state open --json url --jq '.[0].url // empty')"
            if [ -n "$EXISTING_MAIN_PR" ]; then
              echo "develop→mainのPR（$EXISTING_MAIN_PR）が既にオープン中のため、新規作成をスキップします"
            else
              NEED_MAIN_PR=true
            fi
          fi

          echo "need_bump=$NEED_BUMP" >> "$GITHUB_OUTPUT"
          echo "need_main_pr=$NEED_MAIN_PR" >> "$GITHUB_OUTPUT"
          echo "判定結果: need_bump=$NEED_BUMP need_main_pr=$NEED_MAIN_PR main_version=$MAIN_VERSION dev_version=$DEV_VERSION"

      - name: リリース対象issueの一覧を取得する
        id: issues
        if: steps.state.outputs.need_bump == 'true' || steps.state.outputs.need_main_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          ISSUES_JSON="$(
            {
              gh issue list --label "05.develop" --state open --json number,title,labels
              gh issue list --label "07.m:marge" --state open --json number,title,labels
            } | jq -s 'add | unique_by(.number) | sort_by(.number)'
          )"
          echo "$ISSUES_JSON" > /tmp/release-issues.json

          jq -r '.[] | "- #\(.number) \(.title)"' /tmp/release-issues.json > /tmp/release-issue-lines.txt
          if [ ! -s /tmp/release-issue-lines.txt ]; then
            echo "（05.develop・07.m:margeが付いたissueが見つかりませんでした）" > /tmp/release-issue-lines.txt
          fi
          echo "対象issue:"
          cat /tmp/release-issue-lines.txt

      - name: コード変更内容からバージョンの上げ幅と更新履歴を判定する
        id: version-decision
        if: steps.state.outputs.need_bump == 'true' && github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # github_token省略時は既定のGITHUB_TOKENにフォールバックし、このステップの実行中に
          # チェックアウト済みリポジトリのgit認証情報がWORKFLOW_PATから置き換わってしまう。
          # 後続の「バージョンをbumpして...」ステップの素のgit pushがWORKFLOW_PATの認証情報を
          # 使えるようWORKFLOW_PATを明示する。
          github_token: ${{ secrets.WORKFLOW_PAT }}
          # 本ワークフローはissue-deckアプリ（GitHub App = issue-deck[bot]）からの
          # workflow_dispatchでも起動されるため、非人間アクター起点の実行を明示的に許可する
          # (参考: https://github.com/anthropics/claude-code-action/issues/1299)
          allowed_bots: "issue-deck[bot],claude[bot]"
          claude_args: |
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --json-schema '{"type":"object","properties":{"bump_kind":{"type":"string","enum":["major","minor","patch"]},"reason":{"type":"string"},"changelog":{"type":"array","items":{"type":"string"}}},"required":["bump_kind","reason","changelog"]}'
          prompt: |
            shopping-listリポジトリ（Notionの買い物リストと同期するPWA）で、mainブランチと
            developブランチの実際のコード差分から、(1) セマンティックバージョニング（semver）に
            基づく適切なバージョンの上げ幅、(2) 利用者向けの更新履歴（changelog）の2つを
            判定してください。Issueのラベルは一切参照せず、差分の内容そのものだけから
            判断してください。

            ## 確認すること
            - `git diff origin/main origin/develop` で実際のコード変更内容を確認する
            - `git log origin/main..origin/develop --oneline` でコミット一覧も参考にする

            ## バージョンの上げ幅の判定基準
            - major: 既存の挙動・データ構造・公開APIに対する後方互換性のない変更
              （破壊的変更）が含まれる場合
            - minor: 後方互換性を保ったまま新機能が追加されている場合
            - patch: バグ修正・リファクタリング・ドキュメント更新など、上記のいずれにも
              該当しない変更のみの場合
            - 複数種類の変更が混在する場合は、最も上げ幅が大きい判定を採用する
              （例: 新機能追加とバグ修正が両方含まれる場合はminor）

            ## 更新履歴（changelog）の書き方
            このリポジトリの`frontend/changelog.js`は、アプリの画面上で利用者本人に表示される
            更新履歴です。以下のルールに従って`changelog`配列を組み立ててください。

            - **利用者が画面で体感できる変更のみ**を書く。内部実装・リファクタリング・
              CI/インフラ・ドキュメント・依存関係の更新は書かない
            - 開発者向けの用語（クラス名・関数名・ファイル名・API名・ライブラリ名等）を使わず、
              利用者が自分の操作・見た目の変化として理解できる言葉に言い換える
            - 1項目1文の日本語で、「〜できるようにしました」「〜を修正しました」のように
              完了形で書く（既存の`frontend/changelog.js`の記載例に倣う）
            - 体感できる変更が一つも無い場合は空配列`[]`を返す（無理に埋めない）

            ## 出力
            - bump_kind: major/minor/patchのいずれか
            - reason: その判断根拠（日本語。実際にどのファイル・どのような変更を根拠にしたか
              具体的に触れて説明する）
            - changelog: 上記ルールに沿った更新履歴の文の配列（体感できる変更が無ければ空配列）

      - name: バージョン判定結果を検証する
        id: bump
        # version-decisionステップ自体が失敗した場合でもpatchへフォールバックできるよう、
        # 前ステップの成否によらず実行する
        if: always() && steps.state.outputs.need_bump == 'true' && github.event_name == 'workflow_dispatch'
        env:
          # structured_outputはClaude Codeの判定結果（信頼できないテキストを含みうる）のため、
          # run:本文に直接展開せずenv経由でのみ参照する
          # (.github/workflows/issue-labels.ymlと同じ、script injectionを避ける方針)。
          STRUCTURED_OUTPUT: ${{ steps.version-decision.outputs.structured_output }}
        run: |
          set -e

          BUMP_KIND="$(echo "$STRUCTURED_OUTPUT" | jq -r '.bump_kind // empty' 2>/dev/null || true)"
          # PR本文への埋め込み時に改行で崩れないよう、1行に平坦化しておく
          REASON="$(echo "$STRUCTURED_OUTPUT" | jq -r '.reason // empty' 2>/dev/null | tr '\n' ' ' || true)"

          case "$BUMP_KIND" in
            major|minor|patch) ;;
            *)
              echo "Claude Codeによるバージョン判定が失敗・不正な結果だったため、patchにフォールバックします（判定結果: '$BUMP_KIND'）"
              BUMP_KIND=patch
              REASON="コード差分からのバージョン自動判定に失敗したため、安全側としてpatchにフォールバックしました。実際の変更内容を確認し、必要であればこのPR上でバージョンを修正してください。"
              ;;
          esac

          # 更新履歴は後続ステップでファイルへ書き込むため、改行を含みうる値を安全に渡せるよう
          # JSON配列のまま /tmp のファイルへ保存する（$GITHUB_OUTPUT経由では扱いにくいため）。
          CHANGELOG_JSON="$(echo "$STRUCTURED_OUTPUT" | jq -c '.changelog // []' 2>/dev/null || true)"
          case "$CHANGELOG_JSON" in
            '['*) : ;;
            *) CHANGELOG_JSON='[]' ;;
          esac
          printf '%s' "$CHANGELOG_JSON" > /tmp/release-changelog.json

          echo "bump_kind=$BUMP_KIND" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "判定結果: bump_kind=$BUMP_KIND reason=$REASON changelog=$CHANGELOG_JSON"

      - name: バージョンをbumpしてdevelop向けPRを作成する
        if: always() && steps.state.outputs.need_bump == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
          MAIN_VERSION: ${{ steps.state.outputs.main_version }}
          BUMP_KIND: ${{ steps.bump.outputs.bump_kind }}
          REASON: ${{ steps.bump.outputs.reason }}
        run: |
          set -e

          IFS='.' read -r MAJOR MINOR PATCH <<< "$MAIN_VERSION"
          case "$BUMP_KIND" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            *)
              PATCH=$((PATCH + 1))
              ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          BRANCH="release/v$NEW_VERSION"

          git checkout -b "$BRANCH" origin/develop

          git config user.name "Claude Code"
          git config user.email "claude-code@example.com"

          # npm version の lifecycleフック（package.jsonの`version`スクリプト）が
          # scripts/version-changelog.mjs を実行し、frontend/changelog.js の APP_VERSION 更新と
          # スタブエントリ挿入を行う。--no-git-tag-version でコミット・タグ作成は抑止する
          # （タグはmainへのデプロイ時にdeploy.ymlが作成する）。
          npm version "$NEW_VERSION" --no-git-tag-version

          # スタブの `changes` を、Claude Codeが判定した更新履歴で置き換える。
          # 体感できる変更が無い（空配列）と判定された場合はスタブの文言をそのまま残し、
          # PR本文で人間による編集を促す。
          CHANGELOG_FILLED=false
          if [ -s /tmp/release-changelog.json ] && [ "$(jq 'length' /tmp/release-changelog.json)" -gt 0 ]; then
            node -e '
              const fs = require("fs");
              const lines = JSON.parse(fs.readFileSync("/tmp/release-changelog.json", "utf8"));
              const file = "frontend/changelog.js";
              const content = fs.readFileSync(file, "utf8");
              const placeholder = "      \x27ここに変更内容を記載\x27,\n";
              if (!content.includes(placeholder)) {
                console.error("スタブのプレースホルダーが見つかりませんでした。手動で編集してください。");
                process.exit(1);
              }
              const escaped = lines
                .map((line) => "      \x27" + String(line).replace(/\\/g, "\\\\").replace(/\x27/g, "\\\x27") + "\x27,\n")
                .join("");
              fs.writeFileSync(file, content.replace(placeholder, escaped));
              console.log(`frontend/changelog.js の changes を ${lines.length} 件で置き換えました。`);
            '
            CHANGELOG_FILLED=true
            # 置き換え後の構文が壊れていないことを確認する（changelog.jsは本番の画面で読み込まれる）
            node --check frontend/changelog.js
          else
            echo "利用者が体感できる変更が無いと判定されたため、changelogのスタブ文言をそのまま残します。"
          fi

          git add package.json frontend/changelog.js
          git commit -m "v${NEW_VERSION}をリリースする。"
          git push -u origin "$BRANCH"

          {
            echo "developへの取り込み待ちの変更を v${NEW_VERSION} としてリリースします。"
            echo
            echo "## バージョンの判断根拠"
            echo "コード差分の内容から${BUMP_KIND}バージョンと判定しました。"
            echo
            echo "$REASON"
            echo
            echo "判断が誤っていると思われる場合は、このPR上でバージョンを修正してください。"
            echo
            echo "## 更新履歴（frontend/changelog.js）"
            if [ "$CHANGELOG_FILLED" = "true" ]; then
              echo "コード差分から自動生成しました。**アプリの画面上で利用者に表示される文面のため、マージ前に必ず内容を確認してください。**"
              echo
              jq -r '.[] | "- \(.)"' /tmp/release-changelog.json
            else
              echo "⚠️ 利用者が体感できる変更が無いと判定されたため、スタブの文言（\`ここに変更内容を記載\`）がそのまま残っています。**マージ前に人間が編集してください。**"
            fi
            echo
            echo "## 対象issue"
            cat /tmp/release-issue-lines.txt
            echo
            echo "## 注意点"
            echo "- このPRはGitHub Actionsが自動作成しました（\`.github/workflows/release-develop-to-main.yml\`）"
            echo "- 自動マージはされません。CI通過と更新履歴の文面を確認のうえ、ユーザーがマージしてください"
            echo "- このPRがdevelopへマージされた後、develop→mainのリリースPRを作成するには本ワークフローを改めてworkflow_dispatchで手動起動してください"
          } > /tmp/release-pr-body.md

          gh pr create --base develop --head "$BRANCH" \
            --title "v${NEW_VERSION}をリリースする" \
            --body-file /tmp/release-pr-body.md

      - name: develop→mainのPRを作成する
        # バンプPR作成と同様、develop→mainのPR作成も人間の確認なしに走らないよう
        # workflow_dispatch（手動起動）時のみ実行する（#55）。
        if: steps.state.outputs.need_main_pr == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
          DEV_VERSION: ${{ steps.state.outputs.dev_version }}
        run: |
          set -e

          {
            echo "developの内容をv${DEV_VERSION}としてmainへリリースします。"
            echo
            echo "## 対象issue"
            cat /tmp/release-issue-lines.txt
            echo
            echo "## 注意点"
            echo "- このPRはGitHub Actionsが自動作成しました（\`.github/workflows/release-develop-to-main.yml\`）"
            echo "- develop→mainのマージはCLAUDE.mdの自動マージ不可カテゴリに該当するため自動マージはされません。ユーザーが内容を確認のうえマージしてください"
            echo "- マージ方式は必ず「Create a merge commit」を選んでください（squash mergeはdevelop/mainの祖先のつながりを切ってしまうため厳禁）"
            echo "- mainへのマージ後、deploy.ymlがVPSへデプロイし \`v${DEV_VERSION}\` タグを作成します"
          } > /tmp/main-pr-body.md

          gh pr create --base main --head develop \
            --title "v${DEV_VERSION}をmainへリリースする" \
            --body-file /tmp/main-pr-body.md
